name: Get Service Endpoints

on:
  workflow_dispatch: {}

jobs:
  get-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME || 'cluster' }} --region ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Fetch Service LoadBalancer URLs
        run: |
          echo "### Kubernetes Services ###"
          kubectl get svc
          echo "======================================"
          echo "Backend URL: http://$(kubectl get svc backend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          echo "Frontend URL: http://$(kubectl get svc frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
          echo "======================================"
